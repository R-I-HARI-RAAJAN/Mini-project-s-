<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .content {
        text-align: center;
    }
    .card {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        overflow: hidden;
        background: #ebebeb;
    }
    .card img {
        width: 100%;
        height: auto;
    }
    .card-body {
        padding: 15px;
    }
    .card-title {
        font-size: 1.5rem;
        margin-bottom: 10px;
        color: rgb(80, 72, 61);
    }
    .card-text {
        font-size: 1rem;
        margin-bottom: 15px;
        color: rgb(120, 112, 101);  
    }
    .btn-primary {
        background-color: rgb(80, 72, 61);
        border: none;
    }
    .btn-primary:hover {
        background-color: rgb(100, 92, 81);
    }

</style>
</head>
<body>
    <nav
      class="navbar navbar-expand-lg bg-body-tertiary">

    </nav>
   <div class="content">
    <div class="card" style="width: 18rem;">
        <img src="https://www.apple.com/newsroom/images/2023/09/apple-unveils-iphone-15-pro-and-iphone-15-pro-max/article/Apple-iPhone-15-Pro-lineup-hero-230912_Full-Bleed-Image.jpg.large.jpg" alt="">
      <div class="card-body">
        <h5 class="card-title">Iphone 15 Pro</h5>
        <p class="card-text" >Performance & Connectivity
A17 Pro Chipset (3nm): The industry's first 3-nanometer chip, offering desktop-class GPU performance and improved energy efficiency.

        </p>
        <a href="#" class="btn btn-primary" style="width: 100%;">Go somewhere</a>
      </div>
    </div>
   </div>
</body>
</html>
