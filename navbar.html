<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #1e1919;
            color: aliceblue;
        }
        .nav-contaniner {
            margin-bottom: 50px;
        }
        h2 {
            margin-bottom: 10px;
        }
        .navbar1 {
            background-color: #ffffff;
            padding: 10px 0;
            border-radius: 5px;
        }
        .navbar1 ul {
            list-style-type: none;
            justify-content: center;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
        }
        .navbar1 ul li a {
            color: rgb(5, 1, 1);
            text-decoration: none;
            padding: 10px 15px;
            position: relative;
            background: #cebdbd;
            display: inline-block;
            border-radius: 5px;
        }
        .navbar1 button{
            background: #2148b1;
            color: white;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }
        .navbar1 button:hover {
            background-color: #f0f1f3;
            color: #201a1a;
            border-radius: 5px;
            border-color: rgb(123, 127, 110);
        } 
        .navbar1 a::after {
            content: '';
            position: absolute;
            width: 100%;
            bottom: 0;
            left: 0;
            height: 2px;
            background-color: #000;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }
        .navbar1 ul li a:hover::after {
            transform: scaleX(1);
        }
        .navbar2 {
            width: 200px;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 5px;
            
        }
        .navbar2 ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .navbar2 li {
            margin-bottom: 12px;
        }
        .navbar2 ul li a {
            color: rgb(5, 1, 1);
            text-decoration: none;
            padding: 10px 15px;
            background: #cebdbd;
            display: block;
            border-radius: 5px;
        }
        .navbar2 button{
            background: #2148b1;
            color: white;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
            
        }
        .navbar2 button:hover {
            background-color: #f0f1f3;
            color: #201a1a;
            border-radius: 5px;
            border-color: rgb(123, 127, 110);
        }   
        .navbar2 ul li a:hover {
            background-color: #000;
            color: #fff;
        }
        .navbar3 {
            background-color: #ffffff;
            padding: 10px 0;
            border-radius: 5px;
        }
        .navbar3 ul {
            list-style-type: none;
            justify-content: center;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
            position: relative;
        }
        .navbar3 ul li {
            position: relative;
        }
        .navbar3 ul li a {
            color: rgb(5, 1, 1);
            text-decoration: none;
            padding: 10px 15px;
            background: #cebdbd;
            display: inline-block;
            border-radius: 5px;
        }
        .navbar3 button{
            background: #2148b1;
            color: white;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }
        .navbar3 button:hover {
            background-color: #f0f1f3;
            color: #201a1a;
            border-radius: 5px;
            border-color: rgb(130, 132, 123);
        }
        .dropdown-content { 
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 5px;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            border-radius: 5px;
        }
        .dropdown-content a:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }

    </style>
</head>
<body>
    <div class="nav-contaniner">
    <h1>Variation 1: Horizontal with underline effect</h1>
    <nav class="navbar1">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><button>login</button></li>
        </ul>
    </nav>
    </div>
    <div class="nav-contaniner">
    <h1>Variation 2: Vertical sidebar</h1>
    <nav class="navbar2">       
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><button>login</button></li>
        </ul>
    </nav>
    </div>
    <div class="nav-contaniner">
    <h1>Variation 3: Horizontal with dropdown</h1>
    <nav class="navbar3">
        <ul>
            <li><a href="#home">Home</a></li>
            <li class="dropdown">
                <a href="#about">About ▼</a>
                <div class="dropdown-content">
                    <a href="#webdesign">Web Design</a>
                    <a href="#seo">SEO</a>
                    <a href="#marketing">Marketing</a>
                </div>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><button>login</button></li>    
        </ul>
    </nav>
    </div>
</body>
</html>
